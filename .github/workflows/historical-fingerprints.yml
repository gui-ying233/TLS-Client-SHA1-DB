name: TLS-Client-SHA1-DB historical

on:
  schedule:
    - cron: '41 3 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Historical or full cross-product (full requires policy opt-in)'
        required: true
        default: full
        type: choice
        options:
          - historical
          - full
      target:
        description: 'Optional target ID'
        required: false
        type: string
      recheck:
        description: 'Re-test already recorded configurations'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  plan:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_work: ${{ steps.matrix.outputs.has_work }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - id: matrix
        name: Discover and plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.target || '' }}
          RECHECK: ${{ inputs.recheck || false }}
          MODE: ${{ inputs.mode || 'full' }}
        run: |
          ARGS=(--mode "$MODE" --target "$TARGET" --output matrix.json)
          if [[ "$RECHECK" == 'true' ]]; then ARGS+=(--recheck); fi
          python -m fpdb.cli plan "${ARGS[@]}"

  collect:
    needs: plan
    if: needs.plan.outputs.has_work == 'true'
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.case.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - id: control-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - id: target-python
        if: matrix.case.language == 'python' && !startsWith(matrix.case.target, 'env-')
        continue-on-error: true
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.case.runtime_version }}
          update-environment: false
      - uses: actions/setup-node@v4
        if: matrix.case.language == 'node'
        continue-on-error: true
        with:
          node-version: ${{ matrix.case.runtime_version }}
      - uses: oven-sh/setup-bun@v2
        if: matrix.case.language == 'bun'
        continue-on-error: true
        with:
          bun-version: ${{ matrix.case.runtime_version }}
      - name: Install exact Deno release
        if: matrix.case.language == 'deno'
        env:
          DENO_VERSION: ${{ matrix.case.runtime_version }}
        run: |
          asset=deno-x86_64-unknown-linux-gnu.zip
          url="https://github.com/denoland/deno/releases/download/v${DENO_VERSION}"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$asset" "$url/$asset"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/deno.sha256" "$url/$asset.sha256sum"
          expected="$(awk '{print $1}' "$RUNNER_TEMP/deno.sha256")"
          actual="$(sha256sum "$RUNNER_TEMP/$asset" | awk '{print $1}')"
          [[ "$actual" == "$expected" ]] || { echo '::error::Deno archive checksum mismatch'; exit 1; }
          mkdir -p "$RUNNER_TEMP/deno-exact"
          unzip -q -o "$RUNNER_TEMP/$asset" -d "$RUNNER_TEMP/deno-exact"
          actual="$("$RUNNER_TEMP/deno-exact/deno" --version | awk 'NR==1 {print $2}')"
          [[ "$actual" == "$DENO_VERSION" || "$actual" == "$DENO_VERSION"+* ]] || {
            echo "::error::Deno binary version $actual differs from $DENO_VERSION"
            exit 1
          }
          echo "$RUNNER_TEMP/deno-exact" >> "$GITHUB_PATH"
      - uses: actions/setup-go@v5
        if: matrix.case.language == 'go'
        continue-on-error: true
        with:
          go-version: ${{ matrix.case.runtime_version }}
          cache: false  # Go modules are inside clients/go/*/, not the repository root.
      - uses: ruby/setup-ruby@v1
        if: matrix.case.language == 'ruby'
        continue-on-error: true
        with:
          ruby-version: ${{ matrix.case.runtime_version }}
      - uses: actions/setup-java@v4
        if: matrix.case.language == 'java'
        continue-on-error: true
        with:
          distribution: temurin
          java-version: ${{ matrix.case.runtime_version }}
      - uses: shivammathur/setup-php@v2
        if: matrix.case.language == 'php'
        continue-on-error: true
        with:
          php-version: ${{ matrix.case.runtime_version }}
          extensions: curl, openssl, mbstring, dom, xml
          tools: composer:v2
          coverage: none
      - uses: actions/setup-dotnet@v4
        if: matrix.case.language == 'dotnet'
        continue-on-error: true
        with:
          dotnet-version: ${{ matrix.case.runtime_version }}.x
      - name: Install Java build dependencies
        if: matrix.case.language == 'java'
        run: sudo apt-get update -qq && sudo apt-get install -y maven
      - name: Install exact Rust toolchain
        if: matrix.case.language == 'rust'
        env:
          RUST_VERSION: ${{ matrix.case.runtime_version }}
        run: rustup toolchain install "$RUST_VERSION" --profile minimal
      # Cache *downloads and compiler objects*, never fingerprint observations,
      # complete probe executables or mutable system TLS libraries.
      # GitHub Actions caches are immutable and shared by both collection workflows.
      - name: Cache pip wheels
        if: matrix.case.language == 'python' && !startsWith(matrix.case.target, 'env-')
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-v2-${{ runner.os }}-${{ matrix.case.runtime_version }}-${{ hashFiles('clients/python/*.py') }}
          restore-keys: |
            pip-v2-${{ runner.os }}-${{ matrix.case.runtime_version }}-
      - name: Cache npm tarballs
        if: matrix.case.language == 'node'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-v2-${{ runner.os }}-${{ matrix.case.runtime_version }}
          restore-keys: |
            npm-v2-${{ runner.os }}-${{ matrix.case.runtime_version }}-
      - name: Cache Go modules and compiler objects
        if: matrix.case.language == 'go'
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-v2-${{ runner.os }}-${{ matrix.case.runtime_version }}-${{ hashFiles('clients/go/**/go.mod') }}
          restore-keys: |
            go-v2-${{ runner.os }}-${{ matrix.case.runtime_version }}-
      - name: Cache Maven dependencies
        if: matrix.case.language == 'java'
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-v1-${{ runner.os }}-${{ hashFiles('clients/java/okhttp/pom.xml') }}
      - name: Cache Composer downloads
        if: matrix.case.language == 'php'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/composer
            ~/.composer/cache
          key: composer-v2-${{ runner.os }}-${{ hashFiles('clients/php-guzzle/composer.json') }}
      - name: Cache NuGet packages
        if: matrix.case.language == 'dotnet'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-v2-${{ runner.os }}-${{ matrix.case.runtime_version }}-${{ hashFiles('clients/dotnet/**/*.csproj', 'clients/dotnet-restsharp/**/*.csproj') }}
      - name: Cache Cargo source downloads
        if: matrix.case.language == 'rust'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-v2-${{ runner.os }}-${{ matrix.case.runtime_version }}-${{ hashFiles('clients/rust/Cargo.toml') }}
          restore-keys: |
            cargo-v2-${{ runner.os }}-${{ matrix.case.runtime_version }}-
      - uses: dart-lang/setup-dart@v1
        continue-on-error: true
        if: matrix.case.language == 'dart'
        with:
          sdk: ${{ matrix.case.runtime_version }}
      - uses: erlef/setup-beam@v1
        continue-on-error: true
        if: matrix.case.language == 'erlang'
        with:
          otp-version: ${{ matrix.case.runtime_version }}
      - name: Install C++ Boost.Beast / OpenSSL headers
        if: matrix.case.language == 'cpp'
        run: sudo apt-get update -qq && sudo apt-get install -y libboost-dev libssl-dev
      - name: Install Perl TLS dependencies
        if: matrix.case.language == 'perl'
        continue-on-error: true
        run: sudo apt-get update -qq && sudo apt-get install -y libio-socket-ssl-perl libjson-pp-perl libwww-perl liblwp-protocol-https-perl libwww-mechanize-perl
      - name: Install libcurl development headers
        if: matrix.case.language == 'c'
        continue-on-error: true
        run: sudo apt-get update -qq && sudo apt-get install -y libcurl4-openssl-dev
      - name: Initialize ephemeral local TLS echo
        run: '"${{ steps.control-python.outputs.python-path }}" -m fpdb.local_echo setup "$RUNNER_TEMP/fpdb-local-echo"'
      - name: Collect native HTTP client TLS fingerprints
        env:
          FPDB_CASES_JSON: ${{ toJSON(matrix.cases) }}
          FPDB_PYTHON_BIN: ${{ steps.target-python.outputs.python-path }}
        run: |
          set -euo pipefail
          "${{ steps.control-python.outputs.python-path }}" -m fpdb.local_echo serve "$FPDB_LOCAL_CERT_DIR" &
          echo_pid=$!
          trap 'kill "$echo_pid" 2>/dev/null || true' EXIT
          for attempt in {1..50}; do
            if curl -fsS --noproxy '*' --cacert "$FPDB_LOCAL_CA" \
                --max-time 2 https://echo.fpdb.test:18443/ >/dev/null 2>&1; then break; fi
            if [[ "$attempt" -eq 50 ]]; then echo '::error::Local TLS echo did not become ready'; exit 1; fi
            sleep 0.1
          done
          "${{ steps.control-python.outputs.python-path }}" -m fpdb.cli collect --cases-env FPDB_CASES_JSON --output-dir outbox
      - name: Upload result
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: fingerprint-${{ matrix.id }}
          path: outbox/
          if-no-files-found: error
          retention-days: 7

  persist:
    needs: [plan, collect]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.has_work == 'true' && (needs.collect.result == 'success' || needs.collect.result == 'failure') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # Shared across both workflows: only one writer at any time.
    concurrency:
      group: fingerprint-db-writer-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download result artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: fingerprint-*
          path: inbox/
          merge-multiple: true
      - name: Merge into latest default branch and publish
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git pull --ff-only origin "$DEFAULT_BRANCH"
          python -m fpdb.cli persist --inbox inbox/
          if [[ -d data ]]; then git add -A -- data/; fi
          if git diff --cached --quiet; then
            echo 'No fingerprint changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(fingerprints): update TLS observations'
          git push origin "HEAD:$DEFAULT_BRANCH"
