name: TLS-Client-SHA1-DB update

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Optional target ID (empty means all enabled targets)'
        required: false
        type: string
      recheck:
        description: 'Re-test already recorded configurations'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  plan:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_work: ${{ steps.matrix.outputs.has_work }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - id: matrix
        name: Discover and plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.target || '' }}
          RECHECK: ${{ inputs.recheck || false }}
          MODE: incremental
          SEED: ${{ github.run_number }}
        run: |
          ARGS=(--mode "$MODE" --target "$TARGET" --seed "$SEED" --output matrix.json --group-size 8)
          if [[ "$RECHECK" == 'true' ]]; then ARGS+=(--recheck); fi
          python -m fpdb.cli plan "${ARGS[@]}"

  collect:
    needs: plan
    if: needs.plan.outputs.has_work == 'true'
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.case.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - id: control-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - id: target-python
        if: matrix.case.language == 'python' && !startsWith(matrix.case.target, 'env-')
        continue-on-error: true
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.case.runtime_version }}
          update-environment: false
      - uses: actions/setup-node@v4
        if: matrix.case.language == 'node'
        continue-on-error: true
        with:
          node-version: ${{ matrix.case.runtime_version }}
      - uses: actions/setup-go@v5
        if: matrix.case.language == 'go'
        continue-on-error: true
        with:
          go-version: ${{ matrix.case.runtime_version }}
          cache: false  # Go modules are inside clients/go/*/, not the repository root.
      - uses: ruby/setup-ruby@v1
        if: matrix.case.language == 'ruby'
        continue-on-error: true
        with:
          ruby-version: ${{ matrix.case.runtime_version }}
      - uses: actions/setup-java@v4
        if: matrix.case.language == 'java'
        continue-on-error: true
        with:
          distribution: temurin
          java-version: ${{ matrix.case.runtime_version }}
      - uses: shivammathur/setup-php@v2
        if: matrix.case.language == 'php'
        continue-on-error: true
        with:
          php-version: ${{ matrix.case.runtime_version }}
          extensions: curl, openssl
          coverage: none
      - uses: actions/setup-dotnet@v4
        if: matrix.case.language == 'dotnet'
        continue-on-error: true
        with:
          dotnet-version: ${{ matrix.case.runtime_version }}.x
      # Cache *downloads and compiler objects*, never fingerprint observations,
      # complete probe executables or mutable system TLS libraries.
      # GitHub Actions caches are immutable and shared by both collection workflows.
      - name: Cache pip wheels
        if: matrix.case.language == 'python' && (matrix.case.target == 'python-aiohttp' || matrix.case.target == 'python-pycurl' || matrix.case.target == 'python-tornado' || matrix.case.target == 'python-scrapy' || matrix.case.target == 'python-urllib3')
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-v1-${{ runner.os }}-${{ matrix.case.runtime_version }}-${{ matrix.case.target }}-${{ matrix.case.client_version }}
          restore-keys: |
            pip-v1-${{ runner.os }}-${{ matrix.case.runtime_version }}-
      - name: Cache npm tarballs
        if: matrix.case.language == 'node' && (matrix.case.target == 'node-axios' || matrix.case.target == 'node-undici')
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-v1-${{ runner.os }}-${{ matrix.case.runtime_version }}-${{ matrix.case.target }}-${{ matrix.case.client_version }}
          restore-keys: |
            npm-v1-${{ runner.os }}-${{ matrix.case.runtime_version }}-
      - name: Cache Go modules and compiler objects
        if: matrix.case.language == 'go'
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-v1-${{ runner.os }}-${{ matrix.case.runtime_version }}-${{ matrix.case.target }}-${{ matrix.case.client_version }}-${{ hashFiles('clients/go/**/go.mod') }}
          restore-keys: |
            go-v1-${{ runner.os }}-${{ matrix.case.runtime_version }}-
      - name: Cache Maven dependencies
        if: matrix.case.target == 'java-okhttp'
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-v1-${{ runner.os }}-${{ hashFiles('clients/java/okhttp/pom.xml') }}
      - name: Cache Composer downloads
        if: matrix.case.target == 'php-guzzle'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/composer
            ~/.composer/cache
          key: composer-v1-${{ runner.os }}-${{ matrix.case.client_version }}-${{ hashFiles('clients/php-guzzle/composer.json') }}
      - name: Cache NuGet packages
        if: matrix.case.language == 'dotnet'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-v1-${{ runner.os }}-${{ matrix.case.target }}-${{ hashFiles('clients/dotnet/**/*.csproj', 'clients/dotnet-restsharp/**/*.csproj') }}
      - name: Cache Cargo source downloads
        if: matrix.case.language == 'rust'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-v1-${{ runner.os }}-${{ matrix.case.runtime_version }}-${{ matrix.case.client }}-${{ hashFiles('clients/rust/Cargo.toml') }}
          restore-keys: |
            cargo-v1-${{ runner.os }}-${{ matrix.case.runtime_version }}-
      - uses: dart-lang/setup-dart@v1
        continue-on-error: true
        if: matrix.case.language == 'dart'
        with:
          sdk: ${{ matrix.case.runtime_version }}
      - uses: erlef/setup-beam@v1
        continue-on-error: true
        if: matrix.case.language == 'erlang'
        with:
          otp-version: ${{ matrix.case.runtime_version }}
      - name: Install C++ Boost.Beast / OpenSSL headers
        if: matrix.case.language == 'cpp'
        run: sudo apt-get update -qq && sudo apt-get install -y libboost-dev libssl-dev
      - name: Install Perl TLS dependencies
        if: matrix.case.language == 'perl'
        continue-on-error: true
        run: sudo apt-get update -qq && sudo apt-get install -y libio-socket-ssl-perl libjson-pp-perl libwww-perl liblwp-protocol-https-perl libwww-mechanize-perl
      - name: Install libcurl development headers
        if: matrix.case.language == 'c'
        continue-on-error: true
        run: sudo apt-get update -qq && sudo apt-get install -y libcurl4-openssl-dev
      - name: Collect native HTTP client TLS fingerprints
        env:
          FPDB_CASES_JSON: ${{ toJSON(matrix.cases) }}
          FPDB_PYTHON_BIN: ${{ steps.target-python.outputs.python-path }}
        run: '"${{ steps.control-python.outputs.python-path }}" -m fpdb.cli collect-batch --output-dir outbox'
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: fingerprint-${{ matrix.case.id }}
          path: outbox/
          if-no-files-found: error
          retention-days: 7

  persist:
    needs: [plan, collect]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.has_work == 'true' && (needs.collect.result == 'success' || needs.collect.result == 'failure') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # Shared across both workflows: only one writer at any time.
    concurrency:
      group: fingerprint-db-writer-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download result artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: fingerprint-*
          path: inbox/
          merge-multiple: true
      - name: Merge into latest default branch and publish
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git pull --ff-only origin "$DEFAULT_BRANCH"
          python -m fpdb.cli persist --inbox inbox/
          if [[ -d data ]]; then git add -A -- data/; fi
          if git diff --cached --quiet; then
            echo 'No fingerprint changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(fingerprints): update TLS observations'
          git push origin "HEAD:$DEFAULT_BRANCH"
